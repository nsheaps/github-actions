[tools]
node = "lts"

# Format tools
editorconfig-checker = "latest"
"npm:prettier" = "latest"
"npm:v8r" = "latest"

# Security tools
"npm:secretlint" = "latest"
"npm:@secretlint/secretlint-rule-preset-recommend" = "latest"
syft = "latest"
trivy = "latest"
trufflehog = "latest"
checkov = "latest"
# KICS uses official GitHub Action in CI (Docker-based)
grype = "latest"
gitleaks = "latest"

# Test tools (mikefarah's yq — same one apply-repo-settings/action.sh requires at runtime)
"aqua:mikefarah/yq" = "latest"

