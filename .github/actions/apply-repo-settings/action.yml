name: 'Apply Repo Settings'
description: 'Read .github/settings.yml and apply repository config, rulesets, and (opt-in) collaborators to a repo via the GitHub API. A minimal ephemeral alternative to the repository-settings GitHub App (https://github.com/repository-settings/app), suitable for running inside a workflow.'

branding:
  icon: 'sliders'
  color: 'blue'

inputs:
  token:
    description: 'GitHub token with administration:write on the target repo (typically a GitHub App installation token from checkout-as-app or github-app-auth).'
    required: true

  owner:
    description: 'Target repo owner. Defaults to the current repo owner.'
    required: false
    default: ${{ github.repository_owner }}

  repo:
    description: 'Target repo name. Defaults to the current repo.'
    required: false
    default: ${{ github.event.repository.name }}

  settings-file:
    description: 'Path to the YAML config to apply. Defaults to .github/settings.yml.'
    required: false
    default: '.github/settings.yml'

  dry-run:
    description: 'If true, print what would change without applying.'
    required: false
    default: 'false'

  sections:
    description: 'Comma-separated list of top-level keys to apply. Defaults to "repository,rulesets". "collaborators" is supported but opt-in only — add it explicitly (e.g. "repository,rulesets,collaborators") since granting repo access is higher-consequence than a ruleset tweak. Add others (labels, teams) as we extend support.'
    required: false
    default: 'repository,rulesets'

outputs:
  summary:
    description: 'JSON summary of changes applied. Keys: repository, rulesets_created, rulesets_updated, rulesets_unchanged, collaborators_applied.'
    value: ${{ steps.apply.outputs.summary }}

runs:
  using: 'composite'
  steps:
    - name: Ensure mikefarah/yq is available
      shell: bash
      run: |
        set -euo pipefail
        # The action needs mikefarah's Go yq (supports `-o=json` for
        # YAML→JSON conversion). Some runners pre-install kislyuk's Python
        # yq — a `jq` wrapper that does NOT understand `-o=json` and exits
        # with cryptic "Unknown option" errors. Detect, and if the resolved
        # `yq` is the wrong one, install mikefarah's to /usr/local/bin/yq
        # and prepend that path for subsequent steps so it shadows the
        # pre-installed wrapper.
        install_mikefarah() {
          echo "Installing mikefarah/yq to /usr/local/bin/yq..."
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
        }
        yq_is_mikefarah() {
          # mikefarah's --version line contains the github.com/mikefarah URL.
          "$1" --version 2>&1 | grep -q 'mikefarah'
        }
        if command -v yq >/dev/null 2>&1 && yq_is_mikefarah "$(command -v yq)"; then
          echo "mikefarah/yq already on PATH: $(command -v yq)"
        else
          if command -v yq >/dev/null 2>&1; then
            echo "Wrong yq detected at $(command -v yq) ($(yq --version 2>&1)); shadowing with mikefarah's."
          fi
          install_mikefarah
          echo "/usr/local/bin" >> "$GITHUB_PATH"
        fi
        # Sanity check: must be mikefarah's yq when action.sh runs in the next step.
        # We can't rely on $GITHUB_PATH having taken effect in THIS step, so
        # validate by absolute path if we just installed, else use what's on PATH.
        check_bin=$(command -v yq)
        if [[ -x /usr/local/bin/yq ]] && yq_is_mikefarah /usr/local/bin/yq; then
          check_bin=/usr/local/bin/yq
        fi
        echo "Verifying $check_bin..."
        "$check_bin" --version
        yq_is_mikefarah "$check_bin" || { echo "::error::yq sanity check failed: not mikefarah"; exit 1; }

    - name: Apply settings
      id: apply
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        OWNER: ${{ inputs.owner }}
        REPO: ${{ inputs.repo }}
        SETTINGS_FILE: ${{ inputs.settings-file }}
        DRY_RUN: ${{ inputs.dry-run }}
        SECTIONS: ${{ inputs.sections }}
      run: ${{ github.action_path }}/action.sh
