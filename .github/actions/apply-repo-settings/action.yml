name: 'Apply Repo Settings'
description: 'Read .github/settings.yml and apply repository config + rulesets to a repo via the GitHub API. A minimal ephemeral alternative to the repository-settings GitHub App (https://github.com/repository-settings/app), suitable for running inside a workflow.'

branding:
  icon: 'sliders'
  color: 'blue'

inputs:
  token:
    description: 'Pre-generated GitHub App installation token. When provided, app-id/private-key are not used for authentication. app-id is still required for substituting the actor_id: -1 placeholder in Integration bypass actors.'
    required: false
    default: ''

  app-id:
    description: 'GitHub App ID. Used to substitute the actor_id: -1 placeholder in Integration bypass actors. Also used for authentication when token is not provided. When token is provided and app-id is omitted, the app ID is derived from the installation token at runtime via GET /app.'
    required: false
    default: ''

  private-key:
    description: 'GitHub App private key (PEM). Required when token is not provided.'
    required: false
    default: ''

  owner:
    description: 'Target repo owner. Defaults to the current repo owner.'
    required: false
    default: ${{ github.repository_owner }}

  repo:
    description: 'Target repo name. Defaults to the current repo.'
    required: false
    default: ${{ github.event.repository.name }}

  settings-file:
    description: 'Path to the YAML config to apply. Defaults to .github/settings.yml.'
    required: false
    default: '.github/settings.yml'

  dry-run:
    description: 'If true, print what would change without applying.'
    required: false
    default: 'false'

  sections:
    description: 'Comma-separated list of top-level keys to apply. Defaults to "repository,rulesets". Add others (labels, collaborators, teams) as we extend support.'
    required: false
    default: 'repository,rulesets'

outputs:
  summary:
    description: 'JSON summary of changes applied. Keys: repository, rulesets_created, rulesets_updated, rulesets_unchanged.'
    value: ${{ steps.apply.outputs.summary }}

runs:
  using: 'composite'
  steps:
    - name: Authenticate as GitHub App
      id: app-token
      if: ${{ inputs.token == '' }}
      uses: nsheaps/github-actions/.github/actions/github-app-auth@603052841cd49b9fdc99bc32979ff9c45c9b669e # 2026-05-22
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ inputs.owner }}
        skip-checkout: 'true'

    - name: Ensure yq is available
      shell: bash
      run: |
        if ! command -v yq >/dev/null 2>&1; then
          echo "Installing yq..."
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
        fi
        yq --version

    - name: Apply settings
      id: apply
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token || steps.app-token.outputs.token }}
        APP_ID: ${{ inputs.app-id }}
        OWNER: ${{ inputs.owner }}
        REPO: ${{ inputs.repo }}
        SETTINGS_FILE: ${{ inputs.settings-file }}
        DRY_RUN: ${{ inputs.dry-run }}
        SECTIONS: ${{ inputs.sections }}
      run: ${{ github.action_path }}/action.sh
