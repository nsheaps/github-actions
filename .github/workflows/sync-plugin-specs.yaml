name: Sync Plugin Specs

on:
  workflow_call:
    inputs:
      plugins-dir:
        description: 'Path to plugins directory'
        type: string
        required: false
        default: 'plugins'
      commit-message:
        description: 'Auto-commit message'
        type: string
        required: false
        default: 'chore(specs): auto-sync plugin SPEC.md files'

permissions: {}

jobs:
  sync-specs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: nsheaps/github-actions/.github/actions/sync-plugin-specs@main
        with:
          plugins-dir: ${{ inputs.plugins-dir || 'plugins' }}
          commit: 'true'
          commit-message: |
            ${{ inputs.commit-message  || 'chore(specs): auto-sync plugin SPEC.md files' }}
